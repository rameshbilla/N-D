# Firebase App Hosting config (runs the Angular SSR + Express server on Cloud Run).
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Secrets are stored in Cloud Secret Manager. Create each one once with:
#   firebase apphosting:secrets:set <secret-name>
# and grant the backend access when the CLI asks (or: firebase apphosting:secrets:grantaccess <secret-name> --backend nd-web).

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ---------- Public site ----------
  # Change to your custom domain once connected (also used as the allowed SSR host).
  - variable: SITE_URL
    value: https://nd-web--n-d-powders.asia-east1.hosted.app
    availability: [BUILD, RUNTIME]

  # ---------- Supabase ----------
  - variable: SUPABASE_URL
    secret: supabase-url
    availability: [BUILD, RUNTIME]
  - variable: SUPABASE_ANON_KEY
    secret: supabase-anon-key
    availability: [BUILD, RUNTIME]
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: supabase-service-role-key
    availability: [RUNTIME]

  # ---------- Admin ----------
  - variable: INITIAL_SUPER_ADMIN_PHONE
    secret: initial-super-admin-phone
    availability: [RUNTIME]

  # ---------- OTP abuse protection ----------
  - variable: OTP_RESEND_COOLDOWN_SECONDS
    value: "45"
  - variable: OTP_MAX_SENDS_PER_HOUR
    value: "5"
  - variable: OTP_MAX_SENDS_PER_IP_PER_HOUR
    value: "20"
  - variable: OTP_MAX_VERIFY_ATTEMPTS
    value: "5"
  - variable: OTP_VERIFY_WINDOW_MINUTES
    value: "15"

  # ---------- Optional integrations ----------
  # Uncomment each block after creating the matching secret.
  # - variable: RAZORPAY_KEY_ID
  #   secret: razorpay-key-id
  # - variable: RAZORPAY_KEY_SECRET
  #   secret: razorpay-key-secret
  # - variable: RAZORPAY_WEBHOOK_SECRET
  #   secret: razorpay-webhook-secret
  # - variable: RESEND_API_KEY
  #   secret: resend-api-key
  # - variable: EMAIL_FROM
  #   value: "N&D Nature Healthy Food <orders@your-domain.in>"
  # - variable: ADMIN_NOTIFICATION_EMAIL
  #   value: you@example.com
  # - variable: WHATSAPP_ACCESS_TOKEN
  #   secret: whatsapp-access-token
  # - variable: WHATSAPP_PHONE_NUMBER_ID
  #   value: ""
  # - variable: WHATSAPP_TEMPLATE_NAME
  #   value: ""
